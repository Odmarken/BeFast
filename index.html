<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Game - BeFast</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <h1>BeFast</h1>
    </header>
    <button id="startButton">Press to Start</button>
    <div id="leaderboard">
        <h2>Leaderboard</h2>
        <ul id="reactionTimes"></ul>
    </div>
    <div id="instructions">React as fast as you can when the red dot appears! The time between pressing the button and
        the dot appearing will be random. Click the dot to register your reaction time. Good luck!</div>
    <div id="dot"></div>
    <script src="assets/js/script.js"></script>
</body>

</html>
